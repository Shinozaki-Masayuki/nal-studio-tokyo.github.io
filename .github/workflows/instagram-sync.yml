name: Instagram Sync

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 06:00 JST (UTC 21:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest Instagram posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/fetch_instagram.py

      - name: Commit changes if any
        run: |
          git config user.name "instagram-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/instagram-posts.json images/instagram
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Instagram posts [automated]"
            git push
          else
            echo "No changes to commit"
          fi
